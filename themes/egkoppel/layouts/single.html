{{ define "main" }}
<article>
    <header>
        <h1>{{ .Title }}</h1>
        <time datetime="{{ .PublishDate }}">{{ .PublishDate.Format "2.1.06" }}</time>
    </header>
    {{ if ne .Draft false }}
    <strong>Hello - somehow you've stumbled across an unfinished post! Please don't expect much of this one (just yet).</strong>
    {{ end }}
    {{ .Content }}
</article>
{{ end }}
