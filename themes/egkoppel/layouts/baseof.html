<!DOCTYPE html>
<html>
  <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" type="text/css" href="{{ absURL `style/main.css` }}">
      <title>My site</title>
  </head>
  <body>
    <nav>
        <ul>
            {{ range .Site.Menus.main }}
            <li>
                <a href="{{ .URL }}">
                {{ .Title }}
                </a>
            </li>
            {{ end }}
        </ul>
    </nav>
    <main>
        {{ block "main" . }}
        {{ end }}
    </main>
  </body>
</html>
